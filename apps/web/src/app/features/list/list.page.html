<ng-container *transloco="let t">
  <mat-toolbar>
    <h1><app-list-menu /></h1>
    <app-profile-button />
  </mat-toolbar>

  @if (list(); as l) {
    <main>
      @if (view().active.length) {
        <ul>
          @for (e of view().active; track e.itemId; let i = $index) {
            <li>
              <button
                #activeRow
                class="row state"
                matRipple
                role="checkbox"
                aria-checked="false"
                (click)="check(l.id, e, i)"
              >
                <mat-icon svgIcon="check_box_outline_blank" />
                <span class="text">
                  <span class="name">{{ e.name }}</span>
                  @if (e.note) {
                    <span class="note">{{ e.note }}</span>
                  }
                </span>
              </button>
              <button matIconButton [attr.aria-label]="t('list.moreFor', { name: e.name })" (click)="edit(l.id, e)">
                <mat-icon svgIcon="more_vert" />
              </button>
            </li>
          }
        </ul>
      } @else {
        <p class="empty">{{ t('list.empty') }}</p>
      }

      @if (view().done.length) {
        <mat-divider />
        <button
          #doneToggle
          class="section state"
          matRipple
          [attr.aria-expanded]="doneOpen()"
          (click)="doneOpen.set(!doneOpen())"
        >
          <mat-icon [svgIcon]="doneOpen() ? 'expand_less' : 'expand_more'" />
          {{ t('list.done', { n: view().done.length }) }}
        </button>
        @if (doneOpen()) {
          <ul class="done">
            @for (e of view().done; track e.itemId; let i = $index) {
              <li>
                <button
                  #doneRow
                  class="row state"
                  matRipple
                  role="checkbox"
                  aria-checked="true"
                  (click)="uncheck(l.id, e, i)"
                >
                  <mat-icon svgIcon="check_box" />
                  <span class="text">
                    <span class="name">{{ e.name }}</span>
                    @if (e.note) {
                      <span class="note">{{ e.note }}</span>
                    }
                  </span>
                </button>
              </li>
            }
          </ul>
        }
      }
    </main>

    <a #fab matFab extended class="fab" routerLink="/add"><mat-icon svgIcon="add" />{{ t('list.add') }}</a>
  }
</ng-container>
