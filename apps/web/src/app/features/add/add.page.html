<ng-container *transloco="let t">
  <div class="frame">
    <header class="band slim">
      <button matIconButton [attr.aria-label]="t('dialog.close')" (click)="close()"><mat-icon svgIcon="close" /></button>
      <h1 class="title">{{ list()?.name }}</h1>
    </header>

    <main class="sheet"><app-add-or-find /></main>
  </div>
</ng-container>
