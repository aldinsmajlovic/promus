# Publishes the image to ghcr.io when a version tag such as v0.2.0 is pushed: as 0.2.0 and as latest.
# Then publishes the version's CHANGELOG.md section as its GitHub release, which older servers show in Settings.
name: Image

on:
  push:
    tags: ['v*']

permissions:
  # the GitHub release
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the app reports this version and links to the docs at this tag
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: The changelog has this version
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '^- ' "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: promus:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 promus:smoke
          # the port proxy resets connections until the server listens
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/health
          docker logs smoke 2>&1 | grep 'Setup code:'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # last, so a server never hears of a version it can't pull yet
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
