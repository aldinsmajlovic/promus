services:
  promus:
    image: ghcr.io/aldinsmajlovic/promus:latest
    # this machine only: put HTTPS in front with tailscale funnel, tailscale serve or a reverse proxy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - promus-data:/data
    restart: unless-stopped

volumes:
  promus-data:
